<!doctype html>
<html lang="fr" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('viewks.theme')) || 'system' } catch (e) {}
    </script>
    <title>viewks · EKS console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
